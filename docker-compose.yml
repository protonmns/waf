services:
  # ── PostgreSQL database ──────────────────────────────────────────────────────
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: prx-waf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prx_waf
      POSTGRES_PASSWORD: prx_waf
      POSTGRES_DB: prx_waf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prx_waf -d prx_waf"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "15432:5432"

  # ── PRX-WAF ──────────────────────────────────────────────────────────────────
  prx-waf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prx-waf
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-with-a-long-random-secret}
      DATABASE_URL: postgresql://prx_waf:prx_waf@postgres:5432/prx_waf
      # Cache backend selection: memory | embedded | standalone | cluster
      # Set to "embedded" to run valkey-server as a child process alongside the WAF.
      # The valkey-server binary is included in the Docker image; no separate service needed.
      CACHE_BACKEND: ${CACHE_BACKEND:-embedded}
    volumes:
      - ./configs:/app/configs      # rw: waf-panel.toml is written by the admin API
      - ./rules:/app/rules:ro
      - waf_certs:/app/certs
    ports:
      - "16880:80"    # HTTP proxy
      - "16843:443"   # HTTPS proxy
      - "16827:9527"  # Management API + Admin Panel (embedded React/Refine SPA at /ui/)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9527/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    cap_add:
      - NET_ADMIN      # required for Pingora raw socket support
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # NOTE: The admin panel (web/admin-panel — React/Refine/AntD) is now embedded
  # directly into the prx-waf binary via `rust_embed` and served at
  # http://localhost:16827/ui/. No standalone nginx container is needed.

volumes:
  postgres_data:
    driver: local
  waf_certs:
    driver: local
